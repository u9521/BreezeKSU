# Material Symbols icons shipped by the manager app.
#
# This file is the source of truth: add, remove or restyle an icon here and
# regenerate - the script itself never needs to change.
#
#   python3 .agents/skills/material-symbols-icons/fetch_material_icons.py
#   python3 .agents/skills/material-symbols-icons/fetch_material_icons.py --icons info
#
# [defaults] is the style shared by every icon. It must stay equal to the
# hand-written SymbolStyle.FilledRounded in
# manager/app/src/main/java/me/weishu/kernelsu/ui/icons/MaterialSymbol.kt,
# otherwise the script refuses to run.
#
# One [[icons]] block per icon; `name` is the Material Symbols name. An entry may
# override any of: family, fill, opsz, wght, grad, rond, auto_mirror. The same
# name may appear twice with different `fill` (e.g. the filled and unfilled
# variants of Cottage). `auto_mirror = true` matches androidx's Icons.AutoMirrored.
# Ranges: opsz 20..48, wght 100..700, fill 0|1, grad -50..200, rond 0..100.

[defaults]
family = "Rounded"
fill = 1
opsz = 24
wght = 400
grad = 0
rond = 50

