# Release signing template. Copy to keystore/sign.properties and fill in real values.
# keystore/sign.properties and any *.jks / *.keystore are git-ignored; this file is committed.
#
# Each value may be overridden by an environment variable of the same name, so CI can supply
# passwords without checking anything in.

# Path to the keystore, resolved against the repository root. Absolute paths are allowed.
keystoreFile=keystore/release.jks

# Keystore password (storepass) and key password (keypass).
keystorePassword=
keyPassword=

# Alias of the signing key inside the keystore.
keyAlias=
